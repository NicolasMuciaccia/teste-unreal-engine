<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f1720" />
    <title>Tour 3D · Apartamento frente mar</title>
    <meta name="description" content="Passeie em 3D pelo apartamento frente mar com hidromassagem em Balneário Camboriú." />
    <meta property="og:title" content="Tour 3D · Apartamento frente mar" />
    <meta property="og:description" content="Passeie em 3D pelo apartamento antes de chegar." />
    <meta property="og:image" content="fotos/capa.jpg" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v12H4z' fill='%230ea5b7'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="loading">
      <div class="loading-card">
        <div class="loading-title" data-i18n="loading">Carregando o apartamento…</div>
        <div class="bar"><div id="bar-fill"></div></div>
        <div class="loading-pct" id="pct">0%</div>
      </div>
    </div>

    <header id="topbar">
      <div class="brand">
        <div class="brand-title" data-i18n="title">Apartamento frente mar</div>
        <div class="brand-sub" data-i18n="subtitle">Balneário Camboriú · tour 3D</div>
      </div>
      <div class="top-actions">
        <select id="lang" aria-label="Idioma">
          <option value="pt">PT</option>
          <option value="en">EN</option>
          <option value="es">ES</option>
        </select>
        <a id="book" class="btn btn-accent" target="_blank" rel="noopener" data-i18n="book">Reservar</a>
      </div>
    </header>

    <div id="labels"></div>

    <div id="hint" class="hint"></div>

    <nav id="bottom">
      <div class="modes">
        <button class="mode" data-mode="dollhouse" data-i18n="dollhouse">Casa de bonecas</button>
        <button class="mode" data-mode="walk" data-i18n="walk">Caminhar</button>
      </div>
      <div id="rooms" class="rooms"></div>
    </nav>

    <aside id="minimap" aria-label="Planta"></aside>

    <div id="joystick"><div class="knob"></div></div>

    <div id="card" class="card hidden" role="dialog" aria-modal="true">
      <button class="card-close" aria-label="Fechar">×</button>
      <img id="card-img" alt="" />
      <div class="card-body">
        <h3 id="card-title"></h3>
        <p id="card-text"></p>
      </div>
    </div>

    <footer id="disclaimer" data-i18n="disclaimer">Modelo ilustrativo criado a partir das fotos do anúncio.</footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
